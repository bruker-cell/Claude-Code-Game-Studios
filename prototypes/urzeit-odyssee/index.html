<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urzeit-Odyssee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: Vollbild-Canvas als Spielwelt; oben eine schmale HUD-Leiste, Karten unten links wie ein Feldbuch über der Landschaft. */
:root{
  --night:#0f1d18;
  --panel:rgba(14,27,22,.86);
  --bone:#f2ead8;
  --muted:#b9b29e;
  --amber:#f2a541;
  --amber-deep:#c4721c;
  --leaf:#93e07f;
  --danger:#ff6150;
  --line:rgba(242,234,216,.16);
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--bone)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 18px;align-items:center;
  background:linear-gradient(rgba(8,16,13,.62),rgba(8,16,13,0))}
.hud-era{display:flex;flex-direction:column;line-height:1.1}
.hud-era b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em}
.hud-era span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud-grow{min-width:0;max-width:440px;justify-self:center;width:100%}
.hud-grow-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.hud-grow-top b{color:var(--bone);font-weight:700}
.bar{height:10px;border-radius:6px;background:rgba(242,234,216,.14);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--amber-deep),var(--amber));transition:width .25s ease-out}
.bar.energy i{background:linear-gradient(90deg,#8fbf5a,var(--leaf))}
.bar.low i{background:linear-gradient(90deg,#b8322a,var(--danger))}
.hud-right{display:flex;align-items:center;gap:12px}
.score{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.hearts{display:flex;gap:3px}
.hearts svg{width:20px;height:19px;display:block}
.icon-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(14,27,22,.6);
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;padding:0}
.icon-btn i{display:block;width:4px;height:14px;border-radius:2px;background:var(--bone)}
.icon-btn:focus-visible,.btn:focus-visible,#btnDash:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (max-width:560px){
  #hud{grid-template-columns:minmax(0,1fr) auto}
  .hud-grow{grid-column:1/-1;grid-row:2;max-width:none}
  .hud-era b{font-size:20px}
}

/* Sprint */
#btnDash{position:fixed;z-index:5;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;border:2px solid rgba(242,234,216,.35);cursor:pointer;touch-action:none;
  font-family:var(--f-display);font-size:17px;letter-spacing:.03em;color:#2a1606;
  background:conic-gradient(var(--amber) calc(var(--cd,1) * 360deg),rgba(242,165,65,.28) 0);
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
#btnDash.cool{color:var(--bone)}

/* Hinweis-Toast */
#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(118px + env(safe-area-inset-top,0px));
  width:min(26rem,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--amber)}
#toast span{font-size:15px}
#toast.show{animation:toastIn .35s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Karten */
#overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:flex-start;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(20deg,rgba(6,12,10,.78) 0%,rgba(6,12,10,.35) 45%,rgba(6,12,10,0) 75%);overflow-y:auto}
.card{width:100%;max-width:31rem;padding:22px 22px 20px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
#overlay.show .card{animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.title{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;max-width:34rem}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.95;text-wrap:balance}
h1{font-size:clamp(56px,15vw,96px);letter-spacing:.01em;color:var(--bone);text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 em{font-style:normal;color:var(--amber)}
h2{font-size:clamp(34px,9vw,46px)}
.lead{margin:0;font-size:17px;max-width:34ch}
.card p{margin:0}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:10px;font-size:15px;padding-top:8px;border-top:1px solid var(--line)}
.facts li b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg::before{content:"";width:14px;height:14px;border-radius:50%;box-sizing:border-box}
.lg.ok::before{border:2px solid var(--leaf)}
.lg.bad::before{border:2px dashed var(--danger)}
.lg.fos::before{background:radial-gradient(circle,#ffd98a 30%,rgba(242,165,65,.2) 70%)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;padding:13px 22px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(242,234,216,.4);background:rgba(242,234,216,.06);color:var(--bone);touch-action:manipulation}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#2a1606}
.btn:hover{filter:brightness(1.08)}
.hint{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:rgba(242,234,216,.06)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Zeitleiste im Titel: Breiten entsprechen echten Millionen Jahren */
.timeline{display:flex;gap:3px;max-width:30rem}
.seg{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg i{display:block;height:12px;border-radius:4px}
.seg span{font-size:13px;font-weight:700}
.seg small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.t i{background:#d39256}.seg.j i{background:#6f9a48}.seg.k i{background:#93b65a}
.seg.x{flex:0 0 auto}.seg.x i{width:12px;background:var(--danger)}

/* Fossilbuch */
.book{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding-right:4px}
.fossil{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fossil .ico{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f3d9a3,#b98a4a);position:relative}
.fossil .ico::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(90,55,20,.6);border-right-color:transparent}
.fossil.locked .ico{background:rgba(242,234,216,.1)}
.fossil.locked .ico::after{display:none}
.fossil b{display:block;font-size:15px}
.fossil small{display:block;font-size:12px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase}
.fossil span{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  #overlay.show .card,#toast.show{animation:none}
  .bar i{transition:none}
}
</style>

<canvas id="game" aria-label="Spielwelt"></canvas>

<header id="hud" hidden>
  <div class="hud-era"><b id="hudEra">Trias</b><span id="hudClock">vor 252 Mio. J.</span></div>
  <div class="hud-grow">
    <div class="hud-grow-top"><span><b id="hudHero">Eoraptor</b> <span id="hudLabel">Wachstum</span></span><span id="hudPct">0 %</span></div>
    <div class="bar" id="hudBarWrap"><i id="hudBar"></i></div>
  </div>
  <div class="hud-right">
    <span class="score" id="hudScore">0</span>
    <div class="hearts" id="hudHearts"></div>
    <button class="icon-btn" id="btnPause" aria-label="Pause"><i></i><i></i></button>
  </div>
</header>
<button id="btnDash" hidden aria-label="Sprint">Sprint</button>
<div id="toast" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>

  world = { i, E, creatures: [], low: [], high: [], patches: [], fossils: [], seeds: [], craters: [], respawn: [], pattern: makeGround(E.pal) };
  for (const [type, count] of Object.entries(E.decor)) {
    const d = DECOR[type];
    for (let k = 0; k < count; k++) {
      const item = { x: R() * WORLD, y: R() * WORLD, r: d.r[0] + R() * (d.r[1] - d.r[0]), img: sprites[type][k % 5], z: d.z };
      if (d.high && Math.hypot(item.x - WORLD / 2, item.y - WORLD / 2) < 160) continue;
      (d.high ? world.high : world.low).push(item);
    }
  }
  world.low.sort((a, b) => a.z - b.z);
  for (let k = 0; k < 36; k++) world.patches.push({ x: R() * WORLD, y: R() * WORLD, r: 150 + R() * 380, col: E.pal.patches[k % 3], a: .16 + R() * .16 });
  E.species.forEach(prepSpecies);
  for (const sp of E.species) for (let k = 0; k < sp.n; k++) spawnCreature(sp, true);
  for (const f of E.fossils) {
    let x, y;
    for (let k = 0; k < 40; k++) {
      x = 200 + R() * (WORLD - 400); y = 200 + R() * (WORLD - 400);
      if (Math.hypot(x - WORLD / 2, y - WORLD / 2) > 650 && world.fossils.every(o => Math.hypot(o.x - x, o.y - y) > 700)) break;
    }
    world.fossils.push({ ...f, x, y, got: false });
  }
  parts = []; setupAmbient();
}

function makePlayer(E, opts = {}) {
  const sp = prepSpecies({ ...E.hero });
  const s = opts.s || (E.finale ? 11 : CONFIG.startSize);
  return { sp, x: WORLD / 2, y: WORLD / 2, vx: 0, vy: 0, a: -Math.PI / 2, s, targetS: s, phase: 0, seed: 1,
    hearts: opts.hearts || CONFIG.hearts, inv: 0, dash: 0, dashCd: 0, bite: 0 };
}

/* =====================================================================
   7. EINGABE – Ziehen (Touch/Maus), Tastatur, Sprint
   ===================================================================== */
const input = { id: null, ox: 0, oy: 0, cx: 0, cy: 0, jx: 0, jy: 0, keys: new Set() };
const JOY_R = 56;
cv.addEventListener('pointerdown', e => {
  Sfx.init();
  if (input.id !== null || !isPlaying()) return;
  input.id = e.pointerId; input.ox = input.cx = e.clientX; input.oy = input.cy = e.clientY; input.jx = input.jy = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== input.id) return;
  input.cx = e.clientX; input.cy = e.clientY;
  let dx = input.cx - input.ox, dy = input.cy - input.oy; const L = Math.hypot(dx, dy);
  if (L > JOY_R) { input.ox = input.cx - dx / L * JOY_R; input.oy = input.cy - dy / L * JOY_R; dx = dx / L * JOY_R; dy = dy / L * JOY_R; }
  input.jx = dx / JOY_R; input.jy = dy / JOY_R;
});
const endPointer = e => { if (e.pointerId === input.id) { input.id = null; input.jx = input.jy = 0; } };
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  input.keys.add(e.code); Sfx.init();
  if (e.code === 'Space') dash();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (isPlaying()) pause(); else if (game.mode === 'paused') resume(); }
});
window.addEventListener('keyup', e => input.keys.delete(e.code));
window.addEventListener('blur', () => input.keys.clear());
$('#btnDash').addEventListener('pointerdown', e => { e.preventDefault(); Sfx.init(); dash(); });
$('#btnPause').addEventListener('click', () => { Sfx.init(); pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && isPlaying()) pause(); });

function isPlaying() { return game.mode === 'play'; }
function moveVector() {
  const k = input.keys;
  let x = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0);
  let y = (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0) - (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0);
  if (x || y) { const L = Math.hypot(x, y); return [x / L, y / L]; }
  const L = Math.hypot(input.jx, input.jy);
  if (L < .12) return [0, 0];
  return L > 1 ? [input.jx / L, input.jy / L] : [input.jx, input.jy];
}
function dash() {
  if (!isPlaying() || !player || player.dashCd > 0) return;
  player.dash = CONFIG.dashTime; player.dashCd = CONFIG.dashCooldown; Sfx.dash();
  burst(player.x, player.y, 'rgba(240,220,180,.7)', 8, 120, player.s * .18);
}

/* =====================================================================
   8. SPIELLOGIK
   ===================================================================== */
const edible = c => c.s <= player.s * CONFIG.eatRatio;
const hunter = c => c.sp.diet === 'carn' && player.s <= c.s * CONFIG.eatRatio;
const danger = c => hunter(c) || (c.sp.defense && c.s > player.s * CONFIG.dangerRatio);

function updateCreature(c, dt, sim) {
  const sp = c.sp, fly = sp.shape === 'fly';
  c.wa += (Math.random() - .5) * (fly ? 9 : 2.2) * dt;
  let dx = Math.cos(c.wa), dy = Math.sin(c.wa), spd = sp.speed * .32;
  c.state = 'wander';
  if (c.idle > 0) { c.idle -= dt; spd = 0; } else if (!fly && Math.random() < dt * .07) c.idle = 1 + Math.random() * 2.5;
  if (sim && player) {
    const px = player.x - c.x, py = player.y - c.y, d = Math.hypot(px, py) || 1;
    const sight = edible(c) ? (sp.diet === 'bug' ? 60 : 110) + c.s * 3 + player.s * 2 : 230 + c.s * 4; // Beute bemerkt dich erst im Bild
    if (d < sight) {
      if (edible(c)) {
        c.state = 'flee'; c.idle = 0; const j = Math.sin(c.phase * .6 + c.seed) * .55;
        dx = -px / d - (py / d) * j; dy = -py / d + (px / d) * j; spd = sp.speed;
      } else if (hunter(c) && c.rest <= 0) {
        c.state = 'chase'; c.idle = 0; c.chase += dt; dx = px / d; dy = py / d; spd = sp.speed;
        if (c.chase > CONFIG.chaseMax) { c.rest = CONFIG.chaseRest; c.chase = 0; }
      }
    } else c.chase = Math.max(0, c.chase - dt);
  }
  c.rest -= dt;
  const m = 140;
  if (c.x < m) dx += 1.4; if (c.x > WORLD - m) dx -= 1.4; if (c.y < m) dy += 1.4; if (c.y > WORLD - m) dy -= 1.4;
  if (c.state === 'wander' && (c.x < m || c.x > WORLD - m || c.y < m || c.y > WORLD - m)) c.wa = Math.atan2(dy, dx);
  const L = Math.hypot(dx, dy) || 1, k = Math.min(1, dt * (fly ? 6 : 3));
  c.vx += (dx / L * spd - c.vx) * k; c.vy += (dy / L * spd - c.vy) * k;
  c.x = clamp(c.x + c.vx * dt, 10, WORLD - 10); c.y = clamp(c.y + c.vy * dt, 10, WORLD - 10);
  const v = Math.hypot(c.vx, c.vy);
  if (v > 4) c.a = angLerp(c.a, Math.atan2(c.vy, c.vx), Math.min(1, dt * 5));
  c.phase += v * dt / (Math.max(3, c.s) * .5);
  if (c.bite > 0) c.bite -= dt;
}

function updatePlayer(dt) {
  const p = player, [ix, iy] = moveVector(), E = world.E;
  const sp = CONFIG.playerSpeed * Math.sqrt(p.s / CONFIG.startSize) * (E.finale ? 1.3 : 1) * (p.dash > 0 ? CONFIG.dashMult : 1);
  const k = Math.min(1, dt * (p.dash > 0 ? 14 : 8));
  p.vx += (ix * sp - p.vx) * k; p.vy += (iy * sp - p.vy) * k;
  p.x = clamp(p.x + p.vx * dt, p.s, WORLD - p.s); p.y = clamp(p.y + p.vy * dt, p.s, WORLD - p.s);
  const v = Math.hypot(p.vx, p.vy);
  if (v > 8) p.a = angLerp(p.a, Math.atan2(p.vy, p.vx), Math.min(1, dt * 9));
  p.phase += v * dt / (p.s * .55);
  p.s += (p.targetS - p.s) * Math.min(1, dt * 4);
  p.inv -= dt; p.dash -= dt; p.dashCd -= dt; p.bite -= dt;
}

function eat(c) {
  c.alive = false; player.bite = .22;
  const gained = c.s * c.s * CONFIG.growth;
  player.targetS = Math.sqrt(player.targetS * player.targetS + gained);
  game.score += Math.max(1, Math.round(gained / 6));
  burst(c.x, c.y, c.sp.color, 10 + (c.s / 3 | 0), 90 + c.s * 3, Math.max(1.5, c.s * .14));
  Sfx.eat();
  world.respawn.push({ sp: c.sp, t: 3 + Math.random() * 6 });
}

function hurt(cause, fromX, fromY) {
  const p = player; if (p.inv > 0) return;
  p.hearts--; p.inv = CONFIG.invuln; cam.shake = reduceMotion ? 4 : 14; game.hurtFlash = .5; Sfx.hurt();
  if (fromX !== undefined) { const dx = p.x - fromX, dy = p.y - fromY, d = Math.hypot(dx, dy) || 1; p.vx = dx / d * 420; p.vy = dy / d * 420; }
  renderHearts();
  if (p.hearts <= 0) die(cause);
}

function interact() {
  const p = player;
  for (const c of world.creatures) {
    if (!c.alive) continue;
    const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
    const R = c.sp.diet === 'bug' ? p.s * .9 + c.s : c.s * .85 + p.s * .7;
    if (d > R) continue;
    if (edible(c)) { eat(c); continue; }
    if (danger(c) && p.inv <= 0) {
      const verb = c.sp.diet === 'carn' ? 'Gefressen von' : 'Erwischt von';
      hurt(`${verb} ${c.sp.name}`, c.x, c.y); c.rest = 2.2; c.chase = 0; if (c.sp.diet === 'carn') c.bite = .3;
      continue;
    }
    const o = R - d, wp = c.s * c.s / (c.s * c.s + p.s * p.s);
    p.x -= dx / d * o * wp; p.y -= dy / d * o * wp; c.x += dx / d * o * (1 - wp); c.y += dy / d * o * (1 - wp);
  }
  world.creatures = world.creatures.filter(c => c.alive);
  for (const f of world.fossils) {
    if (f.got || Math.hypot(f.x - p.x, f.y - p.y) > p.s + 26) continue;
    f.got = true; game.found.add(f.id); game.score += 100; Sfx.fossil();
    burst(f.x, f.y, '#ffd27a', 18, 160, 3);
    const isNew = !store.fossils.includes(f.id);
    if (isNew) { store.fossils.push(f.id); save(); }
    toast(isNew ? `Neu im Fossilbuch: ${f.title}` : `Fossil: ${f.title}`, f.text);
  }
}

function eraProgress() {
  const E = world.E; if (E.finale) return clamp(F.t / CONFIG.finaleTime, 0, 1);
  return clamp((player.targetS - CONFIG.startSize) / (E.goal - CONFIG.startSize), 0, 1);
}

/* Finale: Einschläge ausweichen, Samen picken */
function startFinale() {
  F = { t: 0, energy: 1, starve: 0, next: 1.4, meteors: [] };
  for (let i = 0; i < 28; i++) spawnSeed(true);
}
function spawnSeed(initial) {
  const a = Math.random() * TAU, d = (initial ? 120 : 420) + Math.random() * 520;
  world.seeds.push({ x: clamp(player.x + Math.cos(a) * d, 40, WORLD - 40), y: clamp(player.y + Math.sin(a) * d, 40, WORLD - 40), ph: Math.random() * TAU });
}
function updateFinale(dt) {
  const p = player; F.t += dt;
  F.energy -= CONFIG.finaleDrain * dt;
  if (F.energy <= 0) { F.energy = 0; F.starve += dt; if (F.starve > 2.5) { F.starve = 0; p.inv = 0; hurt('Verhungert in der Einschlagskälte'); } }
  F.next -= dt;
  if (F.next <= 0) {
    const k = F.t / CONFIG.finaleTime; F.next = lerp(1.3, .5, k) * (.75 + Math.random() * .5);
    const lead = .6 + Math.random() * .5, a = Math.random() * TAU, off = Math.random() * 230;
    const r = 45 + Math.random() * 50 + k * 25, T = lerp(1.7, 1.2, k);
    F.meteors.push({ x: clamp(p.x + p.vx * lead + Math.cos(a) * off, 30, WORLD - 30), y: clamp(p.y + p.vy * lead + Math.sin(a) * off, 30, WORLD - 30), r, t: T, T });
  }
  for (const m of F.meteors) {
    m.t -= dt;
    if (m.t <= 0) {
      m.done = true; Sfx.boom(); cam.shake = reduceMotion ? 4 : 16; game.flash = .35;
      burst(m.x, m.y, '#ff9a3c', 26, 260, 4); burst(m.x, m.y, '#5a4a42', 18, 180, 5);
      world.craters.push({ x: m.x, y: m.y, r: m.r * .8 }); if (world.craters.length > 50) world.craters.shift();
      if (Math.hypot(p.x - m.x, p.y - m.y) < m.r + p.s * .4) hurt('Vom Einschlag getroffen', m.x, m.y);
    }
  }
  F.meteors = F.meteors.filter(m => !m.done);
  for (const s of world.seeds) {
    if (!s.got && Math.hypot(s.x - p.x, s.y - p.y) < p.s + 12) { s.got = true; F.energy = Math.min(1, F.energy + CONFIG.seedEnergy); game.score += 10; Sfx.seed(); burst(s.x, s.y, '#e6c27a', 6, 80, 2); }
  }
  world.seeds = world.seeds.filter(s => !s.got);
  while (world.seeds.length < 28) spawnSeed(false);
  if (F.t >= CONFIG.finaleTime && game.mode === 'play') win();
}

function update(dt) {
  game.time += dt;
  game.flash = Math.max(0, game.flash - dt * 2); game.hurtFlash = Math.max(0, game.hurtFlash - dt * 1.6);
  cam.shake = Math.max(0, cam.shake - dt * 40);
  const sim = game.mode === 'play';
  if (game.mode !== 'paused') {
    for (const c of world.creatures) updateCreature(c, dt, sim);
  }
  if (sim) {
    updatePlayer(dt);
    if (world.E.finale) updateFinale(dt);
    else {
      interact();
      for (const r of world.respawn) { r.t -= dt; if (r.t <= 0) { r.done = true; spawnCreature(r.sp, false); } }
      world.respawn = world.respawn.filter(r => !r.done);
      if (player.targetS >= world.E.goal && game.mode === 'play') eraDone();
    }
    updateHud();
  }
  for (const q of parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .93; q.vy *= .93; }
  parts = parts.filter(q => q.t < q.life);
  updateCamera(dt);
  updateAmbient(dt);
}

function updateCamera(dt) {
  if (game.mode === 'title' || !player) {
    const t = game.time * .05; cam.x = WORLD / 2 + Math.cos(t) * 520; cam.y = WORLD / 2 + Math.sin(t * .8) * 420;
    cam.zoom = Math.sqrt(W * H) / (CONFIG.viewBase * 1.75); return;
  }
  const grow = Math.pow(player.s / CONFIG.startSize, CONFIG.viewGrow);
  const tz = Math.sqrt(W * H) / (CONFIG.viewBase * 1.45 * grow * (world.E.finale ? 1.1 : 1));
  cam.zoom += (tz - cam.zoom) * Math.min(1, dt * 2.5);
  const tx = player.x + player.vx * .25, ty = player.y + player.vy * .25;
  const k = Math.min(1, dt * 5); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}

function burst(x, y, col, n, spd, size) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = spd * (.3 + Math.random() * .7); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: .35 + Math.random() * .45, col, size: size * (.6 + Math.random() * .8) }); }
}

/* Schwebeteilchen je Epoche: Staub, Pollen, Blütenblätter, Asche */
let camPrev = null;
function setupAmbient() {
  const type = world ? world.E.pal.ambient : 'dust', n = reduceMotion ? 12 : (type === 'ash' ? 70 : 38);
  amb = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .4 + Math.random(), ph: Math.random() * TAU, ember: Math.random() < .25 }));
}
function updateAmbient(dt) {
  if (!world) return;
  const type = world.E.pal.ambient, cdx = camPrev ? (cam.x - camPrev[0]) * cam.zoom : 0, cdy = camPrev ? (cam.y - camPrev[1]) * cam.zoom : 0;
  camPrev = [cam.x, cam.y];
  for (const a of amb) {
    a.ph += dt;
    let vx = 0, vy = 0;
    if (type === 'dust') { vx = 14 * a.z; vy = Math.sin(a.ph * .7) * 4; }
    else if (type === 'pollen') { vx = Math.sin(a.ph * .5) * 8; vy = Math.cos(a.ph * .4) * 6 - 3; }
    else if (type === 'petal') { vx = 18 * a.z; vy = 9 * a.z + Math.sin(a.ph) * 6; }
    else { vx = 6 * a.z; vy = a.ember ? -22 * a.z : 26 * a.z; }
    a.x += vx * dt - cdx * (.6 + .5 * a.z); a.y += vy * dt - cdy * (.6 + .5 * a.z);
    if (a.x < -20) a.x += W + 40; if (a.x > W + 20) a.x -= W + 40; if (a.y < -20) a.y += H + 40; if (a.y > H + 20) a.y -= H + 40;
  }
}

/* =====================================================================
   9. ZEICHNEN
   ===================================================================== */
function drawDino(c, s, ph) {
  const sp = c.sp, sh = SHAPES[sp.shape], bl = sh.body[0] * s, bw = sh.body[1] * s;
  const col = sp.color, dark = sp._dark, acc = sp.accent;
  const mv = Math.min(1, Math.hypot(c.vx, c.vy) / (sp.speed * .25 + 20)), step = Math.sin(ph) * mv;
  ctx.fillStyle = dark;
  if (sh.legs === 4) {
    const ly = bw * (sh.sprawl ? 1.05 : .8), lx = bl * .55;
    [[lx, -ly, step], [lx, ly, -step], [-lx, -ly, -step], [-lx, ly, step]].forEach(([x, y, st]) => { ell(ctx, x + st * s * .2, y, s * .21, s * .13); ctx.fill(); });
  } else {
    const ly = bw * .74;
    [[-ly, step], [ly, -step]].forEach(([y, st]) => { ell(ctx, -bl * .1 + st * s * .32, y, s * .28, s * .13); ctx.fill(); });
  }
  // Schwanz
  const T = sh.tail * s, tw = sh.tailW * s, bx = -bl * .55, wig = Math.sin(ph * .5 + c.seed) * T * .16 * (.4 + mv * .6);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(bx, -tw);
  ctx.quadraticCurveTo(bx - T * .55, -tw * .55 + wig * .5, bx - T, wig); ctx.quadraticCurveTo(bx - T * .55, tw * .55 + wig * .5, bx, tw); ctx.closePath(); ctx.fill();
  if (sh.club) { ctx.fillStyle = acc; ell(ctx, bx - T, wig, s * .24, s * .2); ctx.fill(); ctx.fillStyle = BONE; ell(ctx, bx - T - s * .05, wig - s * .05, s * .08, s * .06); ctx.fill(); }
  if (sh.spikes) {
    ctx.strokeStyle = BONE; ctx.lineWidth = s * .06; ctx.lineCap = 'round';
    for (const k of [.8, .95]) { const x = bx - T * k, y = wig * k; line(ctx, x, y - s * .04, x - s * .14, y - s * .4); line(ctx, x, y + s * .04, x - s * .14, y + s * .4); }
  }
  // Körper
  if (sp.feathers || sh.fur) { ctx.strokeStyle = sh.fur ? dark : acc; ctx.lineWidth = s * .09; ctx.setLineDash([s * .1, s * .09]); ell(ctx, 0, 0, bl * 1.03, bw * 1.06); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle = col; ell(ctx, 0, 0, bl, bw); ctx.fill();
  ctx.save(); ell(ctx, 0, 0, bl, bw); ctx.clip();
  ctx.fillStyle = acc;
  if (sp.pattern === 'stripes') { ctx.globalAlpha = .5; for (let i = -3; i <= 3; i++) { ell(ctx, i * bl * .26, 0, s * .05, bw * .78); ctx.fill(); } }
  else if (sp.pattern === 'spots') { ctx.globalAlpha = .45; for (let i = 0; i < 7; i++) { const a = c.seed * 3 + i * 2.4; ell(ctx, Math.cos(a) * bl * .55, Math.sin(a * 1.3) * bw * .5, s * .07, s * .06); ctx.fill(); } }
  else if (sp.pattern === 'band') { ctx.globalAlpha = .45; ell(ctx, 0, 0, bl * .9, bw * .32); ctx.fill(); }
  else if (sp.pattern === 'scutes') { ctx.globalAlpha = .7; for (let i = -4; i <= 4; i++) { ctx.fillRect(i * bl * .2 - s * .06, -s * .14, s * .12, s * .1); ctx.fillRect(i * bl * .2 - s * .06, s * .04, s * .12, s * .1); } }
  if (sh.armor) { ctx.globalAlpha = .8; for (let i = -3; i <= 3; i++) for (let j = -2; j <= 2; j++) { ell(ctx, i * bl * .25 + (j % 2) * bl * .12, j * bw * .32, s * .07, s * .07); ctx.fill(); } }
  ctx.globalAlpha = 1;
  const la = -c.a, lx = Math.cos(la) * -.6 - Math.sin(la) * -.8, ly = Math.sin(la) * -.6 + Math.cos(la) * -.8;
  ctx.fillStyle = 'rgba(255,246,220,.14)'; ell(ctx, lx * bw * .45, ly * bw * .45, bl * .62, bw * .5); ctx.fill();
  ctx.restore();
  if (sh.armor) { ctx.fillStyle = BONE; for (let i = -2; i <= 2; i++) for (const sd of [-1, 1]) { const x = i * bl * .35; ctx.beginPath(); ctx.moveTo(x - s * .07, sd * bw * .92); ctx.lineTo(x, sd * (bw + s * .2)); ctx.lineTo(x + s * .07, sd * bw * .92); ctx.fill(); } }
  if (sh.plates) {
    for (let i = 0; i < 9; i++) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5200);
}
function card(html, cls = '') {
  const o = $('#overlay'), c = $('#card'); c.className = `card ${cls}`; c.innerHTML = html;
  o.hidden = false; o.classList.remove('show'); void o.offsetWidth; o.classList.add('show');
  const b = c.querySelector('.btn.primary'); if (b && finePointer) setTimeout(() => b.focus({ preventScroll: true }), 50);
}
function closeCard() { $('#overlay').hidden = true; }
const stat = (v, l) => `<div><b>${v}</b><span>${l}</span></div>`;

function showTitle() {
  const n = store.fossils.length;
  card(`
    <p class="eyebrow">252 → 66 Millionen Jahre</p>
    <h1>Urzeit-<br><em>Odyssee</em></h1>
    <p class="lead">Wachse vom Winzling zum Riesen, durch Trias, Jura und Kreide. Und dann kommt der Asteroid.</p>
    <div class="timeline" aria-label="Zeitleiste in Millionen Jahren">
      <div class="seg t" style="flex:51"><i></i><span>Trias</span><small>252</small></div>
      <div class="seg j" style="flex:56"><i></i><span>Jura</span><small>201</small></div>
      <div class="seg k" style="flex:79"><i></i><span>Kreide</span><small>145</small></div>
      <div class="seg x"><i></i><span>&nbsp;</span><small>66</small></div>
    </div>
    <div class="row"><button class="btn primary" data-act="play">Spielen</button><button class="btn" data-act="book">Fossilbuch ${n}/${ALL_FOSSILS.length}</button></div>
    <p class="hint">Ziehen zum Laufen, Sprint-Knopf zum Spurten. Tastatur: WASD oder Pfeile, Leertaste. ${store.best ? `Rekord: ${store.best} Punkte.` : ''}</p>
  `, 'title');
}
function showIntro() {
  const E = world.E, num = E.finale ? 'Finale' : `Epoche ${world.i + 1} von 3`;
  const years = E.finale ? 'vor 66 Mio. Jahren' : `vor ${E.from}–${E.to} Mio. Jahren`;
  card(`
    <p class="eyebrow">${num} · ${years}</p>
    <h2>${E.finale ? 'Der Einschlag' : E.name}</h2>
    <p class="lead">${E.lead}</p>
    <ul class="facts">${E.intro.map(([k, v]) => `<li><b>${k}</b><span>${v}</span></li>`).join('')}</ul>
    ${E.finale ? `<p class="hint">Rote Kreise zeigen, wo es gleich einschlägt. Überlebe ${CONFIG.finaleTime} Sekunden.</p>`
      : `<div class="legend"><span class="lg ok">fressbar</span><span class="lg bad">gefährlich</span><span class="lg fos">Fossil (3 pro Epoche)</span></div>`}
    <div class="row"><button class="btn primary" data-act="go">Los</button></div>
  `);
}
function showPause() {
  card(`
    <p class="eyebrow">Pause · ${world.E.name}</p>
    <h2>Kurz durchatmen</h2>
    <div class="row">
      <button class="btn primary" data-act="resume">Weiter</button>
      <button class="btn" data-act="retry">Epoche neu</button>
      <button class="btn" data-act="book">Fossilbuch</button>
      <button class="btn" data-act="mute">Ton: ${store.mute ? 'aus' : 'an'}</button>
      <button class="btn" data-act="title">Zum Titel</button>
    </div>
  `);
}
function showBook() {
  const items = ALL_FOSSILS.map(f => {
    const got = store.fossils.includes(f.id);
    return `<div class="fossil ${got ? '' : 'locked'}"><div class="ico"></div><div><small>${f.era}</small><b>${got ? f.title : 'Noch nicht gefunden'}</b><span>${got ? f.text : 'Suche die leuchtenden Ammoniten. Goldene Pfeile am Rand zeigen den Weg.'}</span></div></div>`;
  }).join('');
  card(`
    <p class="eyebrow">Fossilbuch · ${store.fossils.length} von ${ALL_FOSSILS.length}</p>
    <h2>Funde</h2>
    <div class="book">${items}</div>
    <div class="row"><button class="btn primary" data-act="back">Zurück</button></div>
  `);
}

/* =====================================================================
   11. ABLAUF
   ===================================================================== */
function startEra(i, opts = {}) {
  game.era = i; game.found = new Set(); F = null; player = null;
  buildWorld(i);
  player = makePlayer(world.E, opts);
  cam.x = player.x; cam.y = player.y; camPrev = null;
  cam.zoom = Math.sqrt(W * H) / (CONFIG.viewBase * 1.45 * Math.pow(player.s / CONFIG.startSize, CONFIG.viewGrow));
  if (world.E.finale) startFinale();
  game.eraStartScore = opts.score !== undefined ? opts.score : game.score;
  game.score = game.eraStartScore;
  input.id = null; input.jx = input.jy = 0;
  showHud(true);
  if (opts.skipIntro) { closeCard(); game.mode = 'play'; }
  else { game.mode = 'intro'; showIntro(); }
}
function go() {
  closeCard(); game.mode = 'play';
  if (!game.tipShown && !world.E.finale) { game.tipShown = true; toast('Tipp', 'Grüne Ringe kannst du fressen. Rote Ringe meiden. Wachse bis 100 %.'); }
}
function pause() { if (!isPlaying()) return; game.mode = 'paused'; input.id = null; input.jx = input.jy = 0; showPause(); }
function resume() { closeCard(); game.mode = 'play'; }
function eraDone() {
  game.mode = 'done'; Sfx.win(); const E = world.E;
  card(`
    <p class="eyebrow">${E.name} geschafft · vor ${E.to} Mio. Jahren</p>
    <h2>${E.outro.title}</h2>
    <p>${E.outro.text}</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(`${game.found.size}/3`, 'Fossilien')}${stat(Math.round(player.targetS), 'Größe')}</div>
    <div class="row"><button class="btn primary" data-act="next">${E.outro.next}</button></div>
  `);
}
function die(cause) {
  game.mode = 'dead'; game.killer = cause; keepBest();
  card(`
    <p class="eyebrow">${world.E.name} · Spiel vorbei</p>
    <h2>${cause}</h2>
    <p>${world.E.finale ? 'Halte Abstand zu den roten Kreisen und picke genug Samen.' : 'Rote Ringe bedeuten Gefahr. Der Sprint-Knopf hilft bei der Flucht.'}</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(store.best, 'Rekord')}${stat(`${Math.round(eraProgress() * 100)} %`, world.E.finale ? 'überlebt' : 'gewachsen')}</div>
    <div class="row"><button class="btn primary" data-act="retry">Epoche neu starten</button><button class="btn" data-act="title">Zum Titel</button></div>
  `);
}
function win() {
  game.mode = 'won'; game.score += 500; keepBest(); Sfx.win(); showWin();
}
function showWin() {
  card(`
    <p class="eyebrow">Überlebt · vor 66 Mio. Jahren</p>
    <h2>Deine Linie lebt weiter</h2>
    <p>Vögel brüten wenige Wochen statt drei bis sechs Monate und erholten sich so schneller als alle anderen. Jeder Vogel heute ist ein Dinosaurier.</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(store.best, 'Rekord')}${stat(`${store.fossils.length}/${ALL_FOSSILS.length}`, 'Fossilbuch')}</div>
    <div class="row"><button class="btn primary" data-act="again">Nochmal spielen</button><button class="btn" data-act="book">Fossilbuch</button></div>
  `);
}
function keepBest() { if (game.score > store.best) { store.best = game.score; save(); } }
function toTitle() {
  game.mode = 'title'; player = null; F = null; showHud(false); $('#toast').hidden = true;
  buildWorld(0); showTitle();
}

const ACTIONS = {
  play() { game.score = 0; startEra(0); },
  again() { game.score = 0; startEra(0); },
  go, resume,
  next() { startEra(world.i < 2 ? world.i + 1 : 3); },
  retry() { startEra(game.era, { skipIntro: true, score: game.eraStartScore }); },
  title: toTitle,
  book() { game.bookReturn = game.mode === 'paused' ? 'pause' : game.mode === 'won' ? 'won' : 'title'; showBook(); },
  back() { if (game.bookReturn === 'pause') showPause(); else if (game.bookReturn === 'won') showWin(); else showTitle(); },
  mute() { store.mute = !store.mute; save(); showPause(); },
};
$('#overlay').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; Sfx.init(); ACTIONS[b.dataset.act](); });

/* =====================================================================
   12. START (inkl. Live-Update im Claude-Viewer)
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
function start(data) {
  resize();
  if (data && (data.mode === 'play' || data.mode === 'paused') && typeof data.era === 'number') {
    startEra(data.era, { s: data.s, hearts: data.hearts, score: data.eraStartScore, skipIntro: true });
    game.score = data.score || 0; game.tipShown = true; pause();
  } else toTitle();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
window.claude?.hot?.snapshot?.(() => (player && (game.mode === 'play' || game.mode === 'paused')
  ? { mode: game.mode, era: game.era, s: player.targetS, hearts: player.hearts, score: game.score, eraStartScore: game.eraStartScore } : {}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

/* Testzugang für die Konsole: __urzeit.startEra(3) springt zum Finale */
window.__urzeit = { game, startEra, get player() { return player; }, get world() { return world; }, get finale() { return F; } };
})();
</script>
