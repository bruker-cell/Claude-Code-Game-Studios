<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urzeit-Odyssee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: 3D-Welt (WebGL) im Vollbild, darüber eine 2D-Ebene für Joystick und Effekte; oben eine schmale HUD-Leiste, Karten unten links wie ein Feldbuch über der Landschaft. */
:root{
  --night:#0f1d18;
  --panel:rgba(14,27,22,.86);
  --bone:#f2ead8;
  --muted:#b9b29e;
  --amber:#f2a541;
  --amber-deep:#c4721c;
  --leaf:#93e07f;
  --danger:#ff6150;
  --line:rgba(242,234,216,.16);
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--bone)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 18px;align-items:center;
  background:linear-gradient(rgba(8,16,13,.62),rgba(8,16,13,0))}
.hud-era{display:flex;flex-direction:column;line-height:1.1}
.hud-era b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.02em}
.hud-era span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hud-grow{min-width:0;max-width:440px;justify-self:center;width:100%}
.hud-grow-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.hud-grow-top b{color:var(--bone);font-weight:700}
.bar{height:10px;border-radius:6px;background:rgba(242,234,216,.14);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--amber-deep),var(--amber));transition:width .25s ease-out}
.bar.energy i{background:linear-gradient(90deg,#8fbf5a,var(--leaf))}
.bar.low i{background:linear-gradient(90deg,#b8322a,var(--danger))}
.hud-right{display:flex;align-items:center;gap:12px}
.score{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.hearts{display:flex;gap:3px}
.hearts svg{width:20px;height:19px;display:block}
.icon-btn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(14,27,22,.6);
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;padding:0}
.icon-btn i{display:block;width:4px;height:14px;border-radius:2px;background:var(--bone)}
.icon-btn:focus-visible,.btn:focus-visible,#btnDash:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (max-width:560px){
  #hud{grid-template-columns:minmax(0,1fr) auto}
  .hud-grow{grid-column:1/-1;grid-row:2;max-width:none}
  .hud-era b{font-size:20px}
}

/* Sprint */
#btnDash{position:fixed;z-index:5;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;border:2px solid rgba(242,234,216,.35);cursor:pointer;touch-action:none;
  font-family:var(--f-display);font-size:17px;letter-spacing:.03em;color:#2a1606;
  background:conic-gradient(var(--amber) calc(var(--cd,1) * 360deg),rgba(242,165,65,.28) 0);
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
#btnDash.cool{color:var(--bone)}

/* Hinweis-Toast */
#toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(118px + env(safe-area-inset-top,0px));
  width:min(26rem,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--amber)}
#toast span{font-size:15px}
#toast.show{animation:toastIn .35s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Karten */
#overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:flex-start;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(20deg,rgba(6,12,10,.78) 0%,rgba(6,12,10,.35) 45%,rgba(6,12,10,0) 75%);overflow-y:auto}
.card{width:100%;max-width:31rem;padding:22px 22px 20px;border-radius:20px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
#overlay.show .card{animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.title{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;max-width:34rem}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.95;text-wrap:balance}
h1{font-size:clamp(56px,15vw,96px);letter-spacing:.01em;color:var(--bone);text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 em{font-style:normal;color:var(--amber)}
h2{font-size:clamp(34px,9vw,46px)}
.lead{margin:0;font-size:17px;max-width:34ch}
.card p{margin:0}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:10px;font-size:15px;padding-top:8px;border-top:1px solid var(--line)}
.facts li b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg::before{content:"";width:14px;height:14px;border-radius:50%;box-sizing:border-box}
.lg.ok::before{border:2px solid var(--leaf)}
.lg.bad::before{border:2px dashed var(--danger)}
.lg.food::before{background:#efe6d0;border:2px solid var(--leaf)}
.lg.fos::before{background:radial-gradient(circle,#ffd98a 30%,rgba(242,165,65,.2) 70%)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;padding:13px 22px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(242,234,216,.4);background:rgba(242,234,216,.06);color:var(--bone);touch-action:manipulation}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#2a1606}
.btn:hover{filter:brightness(1.08)}
.hint{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;padding:10px 12px;border-radius:12px;background:rgba(242,234,216,.06)}
.stats b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Zeitleiste im Titel: Breiten entsprechen echten Millionen Jahren */
.timeline{display:flex;gap:3px;max-width:30rem}
.seg{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg i{display:block;height:12px;border-radius:4px}
.seg span{font-size:13px;font-weight:700}
.seg small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg.t i{background:#d39256}.seg.j i{background:#6f9a48}.seg.k i{background:#93b65a}
.seg.x{flex:0 0 auto}.seg.x i{width:12px;background:var(--danger)}

/* Fossilbuch */
.book{display:grid;gap:8px;max-height:52vh;overflow-y:auto;padding-right:4px}
.fossil{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fossil .ico{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f3d9a3,#b98a4a);position:relative}
.fossil .ico::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(90,55,20,.6);border-right-color:transparent}
.fossil.locked .ico{background:rgba(242,234,216,.1)}
.fossil.locked .ico::after{display:none}
.fossil b{display:block;font-size:15px}
.fossil small{display:block;font-size:12px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase}
.fossil span{font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  #overlay.show .card,#toast.show{animation:none}
  .bar i{transition:none}
}
</style>

<canvas id="game" aria-label="Spielwelt"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header id="hud" hidden>
  <div class="hud-era"><b id="hudEra">Trias</b><span id="hudClock">vor 252 Mio. J.</span></div>
  <div class="hud-grow">
    <div class="hud-grow-top"><span><b id="hudHero">Eoraptor</b> <span id="hudLabel">Wachstum</span></span><span id="hudPct">0 %</span></div>
    <div class="bar" id="hudBarWrap"><i id="hudBar"></i></div>
  </div>
  <div class="hud-right">
    <span class="score" id="hudScore">0</span>
    <div class="hearts" id="hudHearts"></div>
    <button class="icon-btn" id="btnPause" aria-label="Pause"><i></i><i></i></button>
  </div>
</header>
<button id="btnDash" hidden aria-label="Sprint">Sprint</button>
<div id="toast" hidden></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function updateCreature(c, dt, sim) {
  const sp = c.sp, fly = sp.shape === 'fly';
  c.wa += (Math.random() - .5) * (fly ? 9 : 2.2) * dt;
  let dx = Math.cos(c.wa), dy = Math.sin(c.wa), spd = sp.speed * .32;
  c.state = 'wander';
  if (c.idle > 0) { c.idle -= dt; spd = 0; } else if (!fly && Math.random() < dt * .07) c.idle = 1 + Math.random() * 2.5;
  if (sim && player) {
    const px = player.x - c.x, py = player.y - c.y, d = Math.hypot(px, py) || 1;
    const sight = edible(c) ? (sp.diet === 'bug' ? 60 : 110) + c.s * 3 + player.s * 2 : 230 + c.s * 4; // Beute bemerkt dich erst im Bild

function updatePlayer(dt) {

function update(dt) {

  if (sim) {

    <h2>${E.outro.title}</h2>
    <p>${E.outro.text}</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(`${game.found.size}/3`, 'Fossilien')}${stat(Math.round(player.targetS), 'Größe')}</div>
    <div class="row"><button class="btn primary" data-act="next">${E.outro.next}</button></div>
  `);
}
function die(cause) {
  game.mode = 'dead'; game.killer = cause; keepBest();
  card(`
    <p class="eyebrow">${world.E.name} · Spiel vorbei</p>
    <h2>${cause}</h2>
    <p>${world.E.finale ? 'Halte Abstand zu den roten Kreisen und picke genug Samen.' : 'Rote Ringe bedeuten Gefahr. Mit dem Sprint-Knopf hängst du jeden Jäger ab.'}</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(store.best, 'Rekord')}${stat(`${Math.round(eraProgress() * 100)} %`, world.E.finale ? 'überlebt' : 'gewachsen')}</div>
    <div class="row"><button class="btn primary" data-act="retry">Epoche neu starten</button><button class="btn" data-act="title">Zum Titel</button></div>
  `);
}
function win() { game.mode = 'won'; game.score += 500; keepBest(); Sfx.win(); showWin(); }
function showWin() {
  card(`
    <p class="eyebrow">Überlebt · vor 66 Mio. Jahren</p>
    <h2>Deine Linie lebt weiter</h2>
    <p>Vögel brüten wenige Wochen statt drei bis sechs Monate und erholten sich so schneller als alle anderen. Jeder Vogel heute ist ein Dinosaurier.</p>
    <div class="stats">${stat(game.score, 'Punkte')}${stat(store.best, 'Rekord')}${stat(`${store.fossils.length}/${ALL_FOSSILS.length}`, 'Fossilbuch')}</div>
    <div class="row"><button class="btn primary" data-act="again">Nochmal spielen</button><button class="btn" data-act="book">Fossilbuch</button></div>
  `);
}
function keepBest() { if (game.score > store.best) { store.best = game.score; save(); } }
function toTitle() {
  game.mode = 'title';
  if (player) freeRig(player.rig);
  player = null; showHud(false); $('#toast').hidden = true;
  buildWorld(0); F = null; showTitle();
}

const ACTIONS = {
  play() { game.score = 0; startEra(0); },
  again() { game.score = 0; startEra(0); },
  go, resume,
  next() { startEra(world.i < 2 ? world.i + 1 : 3); },
  retry() { startEra(game.era, { skipIntro: true, score: game.eraStartScore }); },
  title: toTitle,
  book() { game.bookReturn = game.mode === 'paused' ? 'pause' : game.mode === 'won' ? 'won' : 'title'; showBook(); },
  back() { if (game.bookReturn === 'pause') showPause(); else if (game.bookReturn === 'won') showWin(); else showTitle(); },
  mute() { store.mute = !store.mute; save(); showPause(); },
};
$('#overlay').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; Sfx.init(); ACTIONS[b.dataset.act](); });

/* =====================================================================
   12. START (inkl. Live-Update im Claude-Viewer)
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render3D(); renderOverlay(); adaptQuality(dt);
  requestAnimationFrame(frame);
}
function start(data) {
  resize();
  if (data && (data.mode === 'play' || data.mode === 'paused') && typeof data.era === 'number') {
    startEra(data.era, { s: data.s, hearts: data.hearts, score: data.eraStartScore, skipIntro: true });
    game.score = data.score || 0; game.tipShown = true; pause();
  } else toTitle();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
window.claude?.hot?.snapshot?.(() => (player && (game.mode === 'play' || game.mode === 'paused')
  ? { mode: game.mode, era: game.era, s: player.targetS, hearts: player.hearts, score: game.score, eraStartScore: game.eraStartScore } : {}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

/* Testzugang für die Konsole: __urzeit.startEra(3) springt zum Finale */
window.__urzeit = { game, startEra, quality, get player() { return player; }, get world() { return world; }, get finale() { return F; } };
})();
</script>
